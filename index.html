<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sentence Puzzle</title>

<style>
body {
    font-family: Arial, "Comic Sans MS", sans-serif;
    background:#eaf6f3;
    padding:30px;
}

.container {
    max-width:900px;
    margin:auto;
}

h1 {
    color:#234;
}

.section {
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:30px;
}

.sentence {
    font-size:32px;
    font-weight:bold;
}

button {
    font-size:22px;
    padding:12px;
    border-radius:12px;
    border:none;
    background:#8fc8b7;
    margin:5px;
}

input {
    width:100%;
    font-size:28px;
    padding:12px;
}

.word-bank, .target {
    min-height:100px;
    padding:15px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    border-radius:15px;
}

.word-bank {
    background:#dff2eb;
}

.target {
    background:#fff7d6;
}

.word {
    background:#b7d9ff;
    padding:15px;
    border-radius:12px;
    font-size:28px;
    cursor:pointer;
}

.correct {
    background:#b8efb8;
}
</style>

</head>

<body>

<div class="container">

<h1>Sentence Puzzle 🔊</h1>

<div class="section">

<h2>Read the sentence</h2>

<div class="sentence" id="sentence"></div>

<button onclick="readSentence()">🔊 Read</button>

</div>


<div class="section">

<h2>Build the sentence</h2>

<p>Put the words in order:</p>

<div class="word-bank" id="bank"></div>

<h3>Your sentence:</h3>

<div class="target" id="target"></div>


<button onclick="check()">Check ✅</button>
<button onclick="nextSentence()">Next ➡️</button>

<h2 id="message"></h2>

</div>


</div>


<script>

const sentences = [

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];


let number = 0;


const speech = window.speechSynthesis;


function speak(text){

speech.cancel();

let voice = new SpeechSynthesisUtterance(text);

voice.rate = 0.75;
voice.pitch = 1;

speech.speak(voice);

}



function readSentence(){

speak(sentences[number]);

}



let words=[];


function loadPuzzle(){

let text = sentences[number];

document.getElementById("sentence").textContent=text;


words=text.split(" ");

words.sort(()=>Math.random()-0.5);


let bank=document.getElementById("bank");

let target=document.getElementById("target");


bank.innerHTML="";
target.innerHTML="";


words.forEach(word=>{

let piece=document.createElement("div");

piece.className="word";

piece.textContent=word;


piece.onclick=function(){

if(piece.parentNode==bank){

target.appendChild(piece);

speak(word);

}

else{

bank.appendChild(piece);

}

};


bank.appendChild(piece);


});


}



function check(){

let made=[...document.getElementById("target").children]
.map(x=>x.textContent)
.join(" ");


if(made==sentences[number]){

document.getElementById("message").textContent=
"Great job! 🎉";

speak("Great job");

document.getElementById("target").classList.add("correct");

}

else{

document.getElementById("message").textContent=
"Try again";

speak("Try again");

}

}



function nextSentence(){

number++;

if(number>=sentences.length){

number=0;

}

loadPuzzle();

document.getElementById("message").textContent="";

}



loadPuzzle();


</script>


</body>
</html>
