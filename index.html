<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Sentence Learning System
</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial;
background:#eaf6f3;
}

.container{
max-width:900px;
margin:auto;
}

.section{
background:white;
padding:30px;
border-radius:24px;
box-shadow:0 4px 10px #bbb;
}

button{

width:100%;

padding:20px;

font-size:28px;

margin-top:15px;

border:none;

border-radius:18px;

background:#8fc8b7;

cursor:pointer;

}

.sentence{

font-size:34px;

font-weight:bold;

margin:20px 0;

}

.word-bank,
.target{

display:flex;

flex-wrap:wrap;

gap:12px;

padding:15px;

min-height:100px;

border-radius:18px;

}

.word-bank{
background:#dff2eb;
}

.target{
background:#fff6cf;
}

.word{

background:#b7d9ff;

padding:14px;

font-size:28px;

border-radius:14px;

cursor:pointer;

}

input{

width:100%;

font-size:28px;

padding:18px;

box-sizing:border-box;

border-radius:18px;

}

.message{

font-size:30px;

font-weight:bold;

margin-top:15px;

}

</style>

</head>

<body>

<div class="container">

<div
class="section"
id="start">

<h1>
Sentence Learning System 🔊
</h1>

<button id="openPuzzle">

🧩 Puzzles

</button>

<button id="openTyping">

✏️ Typing

</button>

</div>

<div
class="section"
id="puzzle"

style="display:none;">

<h2 id="puzzleCounter"></h2>

<div
id="puzzleSentence"

class="sentence">

</div>

<button id="readPuzzle">

🔊 Read

</button>

<div
id="bank"

class="word-bank">

</div>

<div
id="target"

class="target">

</div>

<button id="check">

Check ✅

</button>

<button
id="nextPuzzle"

style="display:none;">

Keep Going ➡️

</button>

<div
id="puzzleMsg"

class="message">

</div>

</div>

<div
class="section"
id="typing"

style="display:none;">

<h2 id="typingCounter"></h2>

<div
id="typingSentence"

class="sentence">

</div>

<button id="readTyping">

🔊 Read

</button>

<input
id="typingInput">

<div
id="typingMsg"

class="message">

</div>

<button
id="nextTyping"

style="display:none;">

Keep Going ➡️

</button>

</div>

</div>

<script>

const sentences=[

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];

let puzzleIndex=0;

let typingIndex=0;

let lastWord="";

function speak(text){

speechSynthesis.cancel();

let u=
new SpeechSynthesisUtterance(
text
);

u.rate=.8;

speechSynthesis.speak(
u
);

}

const start=
document.getElementById(
"start"
);

const puzzle=
document.getElementById(
"puzzle"
);

const typing=
document.getElementById(
"typing"
);

document
.getElementById(
"openPuzzle"
)

.addEventListener(
"click",

()=>{

start.style.display=
"none";

puzzle.style.display=
"block";

loadPuzzle();

}

);

document
.getElementById(
"openTyping"
)

.addEventListener(
"click",

()=>{

start.style.display=
"none";

typing.style.display=
"block";

loadTyping();

}

);

/* PUZZLES */

function loadPuzzle(){

document
.getElementById(
"puzzleCounter"
)
.textContent=

`Puzzle ${
puzzleIndex+1
} of ${
sentences.length
}`;

document
.getElementById(
"puzzleSentence"
)
.textContent=
sentences[
puzzleIndex
];

document
.getElementById(
"bank"
)
.innerHTML="";

document
.getElementById(
"target"
)
.innerHTML="";

document
.getElementById(
"nextPuzzle"
)
.style.display=
"none";

let words=
[
...sentences[
puzzleIndex
]
.split(" ")
];

words.sort(
()=>Math.random()-.5
);

words.forEach(word=>{

let div=
document
.createElement(
"div"
);

div.className=
"word";

div.textContent=
word;

div.onclick=
()=>{

if(
div.parentNode.id===
"bank"
){

document
.getElementById(
"target"
)
.appendChild(
div
);

}

else{

document
.getElementById(
"bank"
)
.appendChild(
div
);

}

speak(
word
);

};

document
.getElementById(
"bank"
)
.appendChild(
div
);

});

}

document
.getElementById(
"readPuzzle"
)

.onclick=
()=>{

speak(
sentences[
puzzleIndex
]
);

};

document
.getElementById(
"check"
)

.onclick=
()=>{

let answer=
[
...
document
.getElementById(
"target"
)
.children
]

.map(
x=>
x.textContent
)

.join(
" "
);

if(

answer
.toLowerCase()

===

sentences[
puzzleIndex
]
.toLowerCase()

){

document
.getElementById(
"nextPuzzle"
)
.style.display=
"block";

document
.getElementById(
"puzzleMsg"
)
.textContent=
"🎉 Correct";

}

};

document
.getElementById(
"nextPuzzle"
)

.onclick=
()=>{

puzzleIndex++;

if(
puzzleIndex<
sentences.length
){

loadPuzzle();

}

};

/* TYPING */

function loadTyping(){

document
.getElementById(
"typingCounter"
)
.textContent=

`Typing ${
typingIndex+1
} of ${
sentences.length
}`;

document
.getElementById(
"typingSentence"
)
.textContent=
sentences[
typingIndex
];

document
.getElementById(
"typingInput"
)
.value="";

document
.getElementById(
"typingMsg"
)
.textContent="";

document
.getElementById(
"nextTyping"
)
.style.display=
"none";

lastWord="";

}

document
.getElementById(
"readTyping"
)

.onclick=
()=>{

speak(
sentences[
typingIndex
]
);

};

document
.getElementById(
"typingInput"
)

.addEventListener(
"input",

function(){

let text=
this.value;

let words=
text
.trim()
.split(/\s+/);

let newest=
words[
words.length-1
];

if(
text.endsWith(" ")
&&
newest
&&
newest!==lastWord
){

lastWord=
newest;

speak(
newest
);

}

if(

text
.trim()
.toLowerCase()

===

sentences[
typingIndex
]
.toLowerCase()

){

document
.getElementById(
"typingMsg"
)
.textContent=
"🎉 Great typing!";

document
.getElementById(
"nextTyping"
)
.style.display=
"block";

}

}

);

document
.getElementById(
"nextTyping"
)

.onclick=
()=>{

typingIndex++;

if(
typingIndex<
sentences.length
){

loadTyping();

}

};

</script>

</body>

</html>
