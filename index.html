<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
Sentence Learning System
</title>

<style>

body{

margin:0;

padding:25px;

font-family:
Arial,
sans-serif;

background:#eaf6f3;

}

.container{

max-width:900px;

margin:auto;

}

.section{

background:white;

padding:30px;

border-radius:25px;

box-shadow:
0 4px 14px #bbb;

margin-bottom:20px;

}

h1{

text-align:center;

font-size:48px;

}

h2{

text-align:center;

font-size:36px;

}

.sentence{

font-size:34px;

font-weight:bold;

margin-bottom:20px;

}

button{

font-size:26px;

padding:18px;

border:none;

border-radius:20px;

cursor:pointer;

background:#8fc8b7;

margin:8px;

}

.big{

width:100%;

height:120px;

font-size:40px;

font-weight:bold;

}

.word-bank,
.target{

display:flex;

flex-wrap:wrap;

gap:12px;

padding:15px;

border-radius:20px;

min-height:100px;

}

.word-bank{

background:#dff2eb;

}

.target{

background:#fff7d6;

}

.word{

background:#b7d9ff;

padding:15px;

border-radius:15px;

font-size:28px;

cursor:pointer;

}

input{

width:100%;

font-size:28px;

padding:15px;

border-radius:15px;

}

.message{

font-size:30px;

font-weight:bold;

margin-top:20px;

}

</style>

</head>

<body>

<div class="container">

<h1>

Sentence Learning System 🔊

</h1>

<!-- START -->

<div
class="section"
id="start">

<h2>

Choose Activity

</h2>

<button
class="big"
onclick="startPuzzle()">

🧩 Puzzles

</button>

<button
class="big"
onclick="startTyping()">

✏️ Typing

</button>

</div>

<!-- PUZZLES -->

<div
class="section"
id="puzzles"

style="display:none;">

<h2 id="counter"></h2>

<div
id="sentence"
class="sentence"></div>

<button
onclick="speak(sentences[puzzleIndex])">

🔊 Read

</button>

<div
id="bank"
class="word-bank"></div>

<div
id="target"
class="target"></div>

<button
onclick="checkPuzzle()">

Check ✅

</button>

<button
id="nextPuzzle"

onclick="nextPuzzle()"

style="display:none;">

Next ➡️

</button>

<div
id="message"

class="message"></div>

</div>

<!-- TYPING -->

<div
class="section"

id="typing"

style="display:none;">

<h2>

Typing Practice

</h2>

<div
id="typingCounter"></div>

<div
id="typingSentence"

class="sentence"></div>

<button
onclick="speak(sentences[typingIndex])">

🔊 Read

</button>

<input

id="typingBox"

placeholder="Type sentence">

<div

id="typingMessage"

class="message"></div>

<button

id="nextTyping"

onclick="nextTyping()"

style="display:none;">

Next ➡️

</button>

</div>

</div>

<script>

const sentences=[

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];

let puzzleIndex=0;

let typingIndex=0;

function speak(text){

speechSynthesis.cancel();

let u=
new SpeechSynthesisUtterance(text);

u.rate=.8;

speechSynthesis.speak(u);

}

/* START */

function startPuzzle(){

document
.getElementById("start")
.style.display="none";

document
.getElementById("puzzles")
.style.display="block";

loadPuzzle();

}

function startTyping(){

document
.getElementById("start")
.style.display="none";

document
.getElementById("typing")
.style.display="block";

loadTyping();

}

/* PUZZLES */

function loadPuzzle(){

counter.textContent=
`Puzzle ${
puzzleIndex+1
} of ${
sentences.length
}`;

sentence.textContent=
sentences[puzzleIndex];

message.textContent="";

nextPuzzle.style.display=
"none";

bank.innerHTML="";

target.innerHTML="";

let words=
[
...sentences[
puzzleIndex
]
.split(" ")
];

words.sort(
()=>Math.random()-.5
);

words.forEach(w=>{

let div=
document
.createElement(
"div"
);

div.className=
"word";

div.textContent=w;

div.onclick=()=>{

if(
div.parentNode===
bank
){

target
.appendChild(
div
);

}

else{

bank
.appendChild(
div
);

}

speak(w);

};

bank.appendChild(
div
);

});

}

function checkPuzzle(){

let made=
[
...target.children
]

.map(
x=>
x.textContent
)

.join(" ");

if(
made
.toLowerCase()
===
sentences[
puzzleIndex
]
.toLowerCase()
){

message.textContent=
"🎉 Great job!";

nextPuzzle.style.display=
"inline-block";

}

else{

message.textContent=
"Try again";

}

}

function nextPuzzle(){

puzzleIndex++;

if(
puzzleIndex<
sentences.length
){

loadPuzzle();

}

else{

message.textContent=
"🎉 Finished!";

}

}

/* TYPING */

function loadTyping(){

typingCounter.textContent=
`Typing ${
typingIndex+1
} of ${
sentences.length
}`;

typingSentence.textContent=
sentences[
typingIndex
];

typingBox.value="";

typingMessage.textContent="";

nextTyping.style.display=
"none";

}

typingBox
.addEventListener(
"input",

()=>{

if(

typingBox
.value
.trim()
.toLowerCase()

===

sentences[
typingIndex
]
.toLowerCase()

){

typingMessage.textContent=
"🎉 Great typing!";

nextTyping.style.display=
"inline-block";

}

}

);

function nextTyping(){

typingIndex++;

if(
typingIndex<
sentences.length
){

loadTyping();

}

else{

typingMessage.textContent=
"🎉 Finished!";

}

}

</script>

</body>

</html>
