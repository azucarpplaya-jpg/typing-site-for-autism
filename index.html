<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Sentence Learning System
</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#eaf6f3;
}

.container{
max-width:900px;
margin:auto;
}

.section{
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 4px 12px #bbb;
}

h1{
text-align:center;
font-size:42px;
}

button{

width:100%;

padding:22px;

font-size:30px;

margin-top:15px;

border:none;

border-radius:18px;

background:#8fc8b7;

cursor:pointer;

}

.sentence{

font-size:34px;

font-weight:bold;

margin:20px 0;

}

.word-bank,
.target{

display:flex;

flex-wrap:wrap;

gap:12px;

padding:15px;

min-height:90px;

border-radius:18px;

}

.word-bank{
background:#dff2eb;
}

.target{
background:#fff4cc;
margin-top:15px;
}

.word{

background:#b7d9ff;

padding:14px;

font-size:28px;

border-radius:14px;

cursor:pointer;

}

input{

width:100%;

font-size:30px;

padding:18px;

border-radius:18px;

box-sizing:border-box;

}

.message{

font-size:30px;

font-weight:bold;

margin-top:20px;

}

</style>

</head>

<body>

<div class="container">

<h1>
Sentence Learning System 🔊
</h1>

<!-- START -->

<div
class="section"
id="start">

<button
onclick="startPuzzle()">

🧩 Puzzles

</button>

<button
onclick="startTyping()">

✏️ Typing

</button>

</div>

<!-- PUZZLES -->

<div
class="section"
id="puzzle"

style="display:none;">

<h2 id="counter"></h2>

<div
id="sentence"

class="sentence">

</div>

<button
onclick="readPuzzle()">

🔊 Read Sentence

</button>

<div
id="bank"

class="word-bank">

</div>

<div
id="target"

class="target">

</div>

<button
onclick="checkPuzzle()">

Check ✅

</button>

<button
id="nextPuzzle"

style="display:none"

onclick="nextPuzzle()">

Next ➡️

</button>

<div
id="message"

class="message">

</div>

</div>

<!-- TYPING -->

<div
class="section"
id="typing"

style="display:none;">

<h2 id="typingCounter"></h2>

<div
id="typingSentence"

class="sentence">

</div>

<button
onclick="readTyping()">

🔊 Read Sentence

</button>

<input
id="typingBox"

placeholder="Type here">

<div
id="typingMessage"

class="message">

</div>

<button
id="nextTyping"

style="display:none"

onclick="nextTyping()">

Next ➡️

</button>

</div>

</div>

<script>

const sentences=[

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];

let puzzleIndex=0;
let typingIndex=0;

let lastWord="";

/* SPEECH */

function speak(text){

speechSynthesis.cancel();

let u=
new SpeechSynthesisUtterance(
text
);

u.rate=.8;

speechSynthesis.speak(
u
);

}

/* START */

function startPuzzle(){

start.style.display=
"none";

puzzle.style.display=
"block";

loadPuzzle();

}

function startTyping(){

start.style.display=
"none";

typing.style.display=
"block";

loadTyping();

}

/* PUZZLES */

function loadPuzzle(){

counter.textContent=
`Puzzle ${
puzzleIndex+1
} of ${
sentences.length
}`;

sentence.textContent=
sentences[
puzzleIndex
];

bank.innerHTML="";
target.innerHTML="";

message.textContent="";

nextPuzzle.style.display=
"none";

let words=
sentences[
puzzleIndex
]

.split(" ")

.sort(
()=>Math.random()-.5
);

words.forEach(word=>{

let tile=
document
.createElement(
"div"
);

tile.className=
"word";

tile.textContent=
word;

tile.onclick=
()=>{

if(
tile.parentNode===
bank
){

target
.appendChild(
tile
);

}else{

bank
.appendChild(
tile
);

}

speak(
word
);

};

bank
.appendChild(
tile
);

});

}

function readPuzzle(){

speak(
sentences[
puzzleIndex
]
);

}

function checkPuzzle(){

let answer=

[
...
target.children
]

.map(
x=>
x.textContent
)

.join(" ");

if(

answer
.toLowerCase()

===

sentences[
puzzleIndex
]
.toLowerCase()

){

message.textContent=
"🎉 Great Job!";

speak(
"Great job"
);

nextPuzzle.style.display=
"block";

}

else{

message.textContent=
"Try again";

speak(
"Try again"
);

}

}

function nextPuzzle(){

puzzleIndex++;

if(
puzzleIndex<
sentences.length
){

loadPuzzle();

}

else{

message.textContent=
"🎉 Finished";

}

}

/* TYPING */

function loadTyping(){

typingCounter.textContent=

`Typing ${
typingIndex+1
} of ${
sentences.length
}`;

typingSentence.textContent=

sentences[
typingIndex
];

typingBox.value="";

typingMessage.textContent="";

nextTyping.style.display=
"none";

lastWord="";

}

function readTyping(){

speak(
sentences[
typingIndex
]
);

}

typingBox
.addEventListener(
"input",

function(){

let text=
this.value;

let words=
text
.trim()
.split(/\s+/);

let newest=
words[
words.length-1
];

/* SPEAK EACH WORD */

if(

text.endsWith(" ")

&&

newest

&&

newest!==lastWord

){

lastWord=
newest;

speak(
newest
);

}

/* COMPLETE */

if(

text
.trim()
.toLowerCase()

===

sentences[
typingIndex
]
.toLowerCase()

){

typingMessage.textContent=
"🎉 Great typing!";

nextTyping.style.display=
"block";

speak(
"Great typing"
);

}

}

);

function nextTyping(){

typingIndex++;

if(
typingIndex<
sentences.length
){

loadTyping();

}

else{

typingMessage.textContent=
"🎉 Finished";

speak(
"Finished typing"
);

}

}

</script>

</body>

</html>
