<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Puzzle + Typing</title>

<style>
body{
font-family:Arial,"Comic Sans MS",sans-serif;
background:#eaf6f3;
padding:25px;
}

.container{max-width:900px;margin:auto;}

.section{
background:white;
padding:25px;
border-radius:20px;
margin-bottom:25px;
box-shadow:0 3px 10px #aaa;
}

h1{color:#234;}

.sentence{
font-size:34px;
font-weight:bold;
}

button{
font-size:22px;
padding:12px 20px;
border:none;
border-radius:15px;
background:#8fc8b7;
cursor:pointer;
margin:5px;
}

.word-bank,.target{
min-height:90px;
display:flex;
flex-wrap:wrap;
gap:12px;
padding:15px;
border-radius:15px;
}

.word-bank{background:#dff2eb;}
.target{background:#fff7d6;}

.word{
background:#b7d9ff;
padding:15px;
border-radius:12px;
font-size:28px;
font-weight:bold;
cursor:pointer;
user-select:none;
}

.correct{background:#b8efb8;}

input{
width:100%;
font-size:28px;
padding:12px;
border-radius:12px;
}

#message,#typingMessage{
font-size:28px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>Sentence Puzzle + Typing 🔊</h1>

<!-- PUZZLES -->
<div class="section" id="puzzleArea">

<h2 id="counter"></h2>

<div id="sentence" class="sentence"></div>

<button onclick="readSentence()">🔊 Read Sentence</button>

<div id="bank" class="word-bank"></div>
<div id="target" class="target"></div>

<button onclick="check()">Check ✅</button>

<button id="nextButton" onclick="nextPuzzle()" style="display:none;">
Keep Going ➡️
</button>

<div id="message"></div>

</div>

<!-- TYPING -->
<div class="section" id="typingArea" style="display:none;">

<h2>Typing Practice ✏️</h2>

<div id="typingCounter"></div>

<div id="typingSentence" class="sentence"></div>

<button onclick="readTyping()">🔊 Read Sentence</button>

<input id="typingBox" placeholder="Type here...">

<div id="typingMessage"></div>

<button id="nextTypingBtn" onclick="nextTyping()" style="display:none;">
Next Typing ➡️
</button>

</div>

</div>

<script>

const sentences=[
"I like to eat watermelon every day",
"My name is Adi",
"I love pasta to eat when appa makes it",
"My brothers name is Sid",
"I go to CABI school"
];

let puzzleIndex=0;
let typingIndex=0;

const speech=window.speechSynthesis;

function speak(text){
speech.cancel();
let u=new SpeechSynthesisUtterance(text);
u.rate=0.75;
speech.speak(u);
}

/* ---------------- PUZZLES ---------------- */

function readSentence(){
speak(sentences[puzzleIndex]);
}

function loadPuzzle(){

document.getElementById("counter").textContent=
"Puzzle "+(puzzleIndex+1)+" of "+sentences.length;

document.getElementById("sentence").textContent=
sentences[puzzleIndex];

document.getElementById("message").textContent="";
document.getElementById("nextButton").style.display="none";

let bank=document.getElementById("bank");
let target=document.getElementById("target");

bank.innerHTML="";
target.innerHTML="";

let words=sentences[puzzleIndex].split(" ");
words.sort(()=>Math.random()-0.5);

words.forEach(word=>{

let piece=document.createElement("div");
piece.className="word";
piece.textContent=word;

piece.onclick=function(){

if(piece.parentNode===bank){
target.appendChild(piece);
speak(word);
}else{
bank.appendChild(piece);
speak(word);
}

};

bank.appendChild(piece);

});

}

function check(){

let made=[...document.getElementById("target").children]
.map(x=>x.textContent)
.join(" ")
.trim()
.toLowerCase();

let answer=sentences[puzzleIndex].toLowerCase();

if(made===answer){
document.getElementById("message").textContent="🎉 Great job!";
speak("Great job!");
document.getElementById("nextButton").style.display="inline-block";
}
else{
document.getElementById("message").textContent="Try again";
speak("Try again");
}

}

function nextPuzzle(){

puzzleIndex++;

if(puzzleIndex>=sentences.length){

document.getElementById("puzzleArea").style.display="none";
document.getElementById("typingArea").style.display="block";

typingIndex=0;
loadTyping();

speak("You finished puzzles. Now let's do typing.");

return;

}

loadPuzzle();

}

/* ---------------- TYPING ---------------- */

let lastWord="";

function loadTyping(){

document.getElementById("typingCounter").textContent=
"Typing "+(typingIndex+1)+" of "+sentences.length;

document.getElementById("typingSentence").textContent=
sentences[typingIndex];

document.getElementById("typingBox").value="";
document.getElementById("typingMessage").textContent="";

document.getElementById("nextTypingBtn").style.display="none";

lastWord="";

}

/* READ FULL SENTENCE */
function readTyping(){
speak(sentences[typingIndex]);
}

/* WORD SPEECH (ONLY FULL WORDS) */
document.getElementById("typingBox").addEventListener("input",function(){

let text=this.value;
let words=text.trim().split(/\s+/);
let last=words[words.length-1];

if(text.endsWith(" ") && last && last!==lastWord && last.length>1){
lastWord=last;
speak(last);
}

});

/* ENTER KEY FIX (IMPORTANT) */
document.getElementById("typingBox").addEventListener("keydown",function(e){

if(e.key==="Enter"){
e.preventDefault();
nextTyping();
}

});

/* LOCKED PROGRESSION */

function nextTyping(){

let input=document.getElementById("typingBox").value.trim().toLowerCase();
let correct=sentences[typingIndex].toLowerCase();

if(input!==correct){
document.getElementById("typingMessage").textContent="❌ Try again";
speak("Try again");
return;
}

document.getElementById("typingMessage").textContent="🎉 Great typing!";
speak("Great typing");

/* SHOW BUTTON ONLY AFTER CORRECT */
document.getElementById("nextTypingBtn").style.display="inline-block";

}

loadPuzzle();

</script>

</body>
</html>
