<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Learning System
</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:
Arial,
sans-serif;

background:#eef5ff;

}

.screen{

display:flex;

flex-direction:column;

align-items:center;

padding:30px;

min-height:100vh;

}

.card{

background:white;

width:100%;

max-width:850px;

border-radius:28px;

padding:35px;

box-shadow:
0 10px 30px
rgba(0,0,0,.08);

}

h1{

text-align:center;

font-size:44px;

color:#244;

}

.grid{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(
180px,
1fr
));

gap:18px;

margin-top:30px;

}

.box{

height:150px;

border-radius:24px;

display:flex;

align-items:center;

justify-content:center;

font-size:34px;

font-weight:bold;

background:
linear-gradient(
135deg,
#75d3ff,
#5e8dff
);

color:white;

cursor:pointer;

transition:.15s;

}

.box:hover{

transform:
translateY(-3px);

}

.lessonBox{

background:
linear-gradient(
135deg,
#7ee7c4,
#57b7ff
);

}

.sentence{

font-size:38px;

text-align:center;

margin:40px 0;

line-height:1.5;

}

input{

width:100%;

font-size:34px;

padding:24px;

border-radius:24px;

border:
3px solid
#d8e5ff;

outline:none;

}

input:focus{

border-color:
#69a8ff;

}

button{

width:100%;

padding:24px;

margin-top:20px;

font-size:28px;

border:none;

border-radius:22px;

background:#69a8ff;

color:white;

cursor:pointer;

}

.words{

display:flex;

flex-wrap:wrap;

gap:14px;

padding:20px;

background:#edf7ff;

border-radius:22px;

min-height:120px;

}

.target{

margin-top:20px;

background:#fff7dd;

}

.word{

padding:16px;

font-size:28px;

background:white;

border-radius:18px;

cursor:pointer;

}

.good{

text-align:center;

font-size:54px;

margin:50px;

}

.small{

text-align:center;

font-size:28px;

color:#666;

}

</style>

</head>

<body>

<!-- MODE -->

<div
class="screen"
id="modeScreen">

<div class="card">

<h1>

Choose Activity

</h1>

<div class="grid">

<div
class="box"

onclick="chooseMode('typing')">

✏️ Typing

</div>

<div
class="box"

onclick="chooseMode('puzzle')">

🧩 Puzzle

</div>

</div>

</div>

</div>

<!-- LESSONS -->

<div
class="screen"

id="lessonScreen"

style="display:none">

<div class="card">

<h1>

Choose Lesson

</h1>

<div
class="grid"
id="lessonGrid">

</div>

</div>

</div>

<!-- ACTIVITY -->

<div
class="screen"

id="activity"

style="display:none">

<div class="card">

<h2
id="count">

</h2>

<div
class="sentence"
id="sentence">

</div>

<button
onclick="readSentence()">

🔊 Read

</button>

<div
id="typingArea">

<input
id="typingInput"

placeholder="Type here">

</div>

<div
id="puzzleArea"

style="display:none">

<div
class="words"
id="bank">

</div>

<div
class="words target"
id="target">

</div>

<button
onclick="checkPuzzle()">

Check

</button>

</div>

</div>

</div>

<!-- GOOD -->

<div
class="screen"

id="good"

style="display:none">

<div class="card">

<div class="good">

🎉 Good Job!

</div>

<div class="small">

Ready for the next one?

</div>

<button
onclick="nextLesson()">

Keep Going ➡️

</button>

</div>

</div>

<script>

const lessons=[

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];

let mode="typing";

let current=0;

let lastWord="";

/* SPEAK */

function speak(text){

speechSynthesis.cancel();

speechSynthesis.speak(
new SpeechSynthesisUtterance(
text
));

}

function readSentence(){

speak(
lessons[
current
]
);

}

/* MODE */

function chooseMode(m){

mode=m;

document
.getElementById(
"modeScreen"
)
.style.display=
"none";

document
.getElementById(
"lessonScreen"
)
.style.display=
"flex";

makeLessons();

}

/* LESSONS */

function makeLessons(){

let grid=
document
.getElementById(
"lessonGrid"
);

grid.innerHTML="";

lessons.forEach(
(
x,
i
)=>{

let div=
document
.createElement(
"div"
);

div.className=
"box lessonBox";

div.textContent=
i+1;

div.onclick=
()=>{

current=i;

openLesson();

};

grid.appendChild(
div
);

});

}

function openLesson(){

document
.getElementById(
"lessonScreen"
)
.style.display=
"none";

document
.getElementById(
"activity"
)
.style.display=
"flex";

document
.getElementById(
"count"
)
.textContent=

`${mode==="typing"
?
"Lesson"
:
"Puzzle"}

 ${
current+1
}`;

document
.getElementById(
"sentence"
)
.textContent=
lessons[
current
];

if(
mode==="typing"
){

typingMode();

}

else{

puzzleMode();

}

}

/* TYPING */

function typingMode(){

typingArea.style.display=
"block";

puzzleArea.style.display=
"none";

typingInput.value="";

typingInput.focus();

lastWord="";

}

typingInput
.addEventListener(
"input",

function(){

let t=
this.value;

let words=
t
.trim()
.split(/\s+/);

let newest=
words[
words.length-1
];

if(

t.endsWith(" ")

&&

newest

&&

newest!==lastWord

){

lastWord=
newest;

speak(
newest
);

}

if(

t.trim()
.toLowerCase()

===

lessons[
current
]
.toLowerCase()

){

finish();

}

}

);

/* PUZZLE */

function puzzleMode(){

typingArea.style.display=
"none";

puzzleArea.style.display=
"block";

bank.innerHTML="";
target.innerHTML="";

let words=
[
...
lessons[
current
]
.split(" ")
];

words.sort(
()=>Math.random()-.5
);

words.forEach(
word=>{

let d=
document
.createElement(
"div"
);

d.className=
"word";

d.textContent=
word;

d.onclick=
()=>{

if(
d.parentNode===
bank
){

target.appendChild(
d
);

}

else{

bank.appendChild(
d
);

}

};

bank.appendChild(
d
);

});

}

function checkPuzzle(){

let made=

[
...
target.children
]

.map(
x=>
x.textContent
)

.join(" ");

if(

made
.toLowerCase()

===

lessons[
current
]
.toLowerCase()

){

finish();

}

}

/* FINISH */

function finish(){

activity.style.display=
"none";

good.style.display=
"flex";

}

function nextLesson(){

current++;

if(
current<
lessons.length
){

good.style.display=
"none";

openLesson();

}

else{

document.body.innerHTML=

`
<div class="screen">
<div class="card">
<div class="good">
🏆 Finished
</div>
</div>
</div>
`;

}

}

</script>

</body>

</html>
