<body>

<div class="container">

<h1>Sentence Learning System 🔊</h1>

<!-- START SCREEN -->
<div class="section" id="startSection">

<h2>Choose Activity</h2>

<button onclick="startMode('puzzle')">
🧩 Puzzles
</button>

<button onclick="startMode('typing')">
✏️ Typing
</button>

</div>

<!-- PUZZLES -->
<div class="section" id="puzzleSection" style="display:none;">

<h2 id="counter"></h2>

<div id="sentence" class="sentence"></div>

<button onclick="speak(sentences[puzzleIndex])">
🔊 Read
</button>

<div id="bank" class="word-bank"></div>

<div id="target" class="target"></div>

<button onclick="checkPuzzle()">
Check ✅
</button>

<button id="nextPuzzleBtn"
onclick="nextPuzzle()"
style="display:none;">
Keep Going ➡️
</button>

<div id="message"></div>

</div>

<!-- TYPING -->
<div class="section"
id="typingSection"
style="display:none;">

<h2>Typing Practice ✏️</h2>

<div id="typingCounter"></div>

<div id="typingSentence"
class="sentence"></div>

<button onclick="speak(sentences[typingIndex])">
🔊 Read
</button>

<input id="typingBox"
placeholder="Type here...">

<div id="typingMessage"></div>

<button id="nextTypingBtn"
onclick="nextTyping()"
style="display:none;">
Next Typing ➡️
</button>

</div>

</div>

<script>

const sentences=[
"I like to eat watermelon every day",
"My name is Adi",
"I love pasta to eat when appa makes it",
"My brothers name is Sid",
"I go to CABI school"
];

let puzzleIndex=0;
let typingIndex=0;

const speech=window.speechSynthesis;

function speak(t){
speech.cancel();

let u=new SpeechSynthesisUtterance(t);

u.rate=.75;

speech.speak(u);
}

/* START */

function startMode(mode){

document.getElementById(
"startSection"
).style.display="none";

if(mode==="puzzle"){

document.getElementById(
"puzzleSection"
).style.display="block";

loadPuzzle();

}

if(mode==="typing"){

document.getElementById(
"typingSection"
).style.display="block";

loadTyping();

}

}

/* PUZZLES */

function loadPuzzle(){

document.getElementById(
"counter"
).textContent=
"Puzzle "+
(puzzleIndex+1)+
" of "+
sentences.length;

document.getElementById(
"sentence"
).textContent=
sentences[puzzleIndex];

document.getElementById(
"message"
).textContent="";

document.getElementById(
"nextPuzzleBtn"
).style.display="none";

let bank=
document.getElementById(
"bank"
);

let target=
document.getElementById(
"target"
);

bank.innerHTML="";
target.innerHTML="";

let words=
sentences[puzzleIndex]
.split(" ")
.sort(
()=>Math.random()-.5
);

words.forEach(word=>{

let tile=
document.createElement(
"div"
);

tile.className=
"word";

tile.textContent=
word;

tile.onclick=()=>{

if(
tile.parentNode===
bank
){

target.appendChild(
tile
);

}else{

bank.appendChild(
tile
);

}

speak(word);

};

bank.appendChild(
tile);

});

}

function checkPuzzle(){

let made=
[
...document
.getElementById(
"target"
)
.children
]
.map(
x=>x.textContent
)
.join(" ")
.toLowerCase();

if(
made===
sentences[
puzzleIndex
]
.toLowerCase()
){

document.getElementById(
"message"
).textContent=
"🎉 Great job!";

document.getElementById(
"nextPuzzleBtn"
).style.display=
"inline-block";

speak(
"Great job"
);

}

}

function nextPuzzle(){

puzzleIndex++;

if(
puzzleIndex<
sentences.length
){

loadPuzzle();

}else{

speak(
"Finished puzzles"
);

}

}

/* TYPING */

function loadTyping(){

document.getElementById(
"typingCounter"
).textContent=
"Typing "+
(
typingIndex+1
)+
" of "+
sentences.length;

document.getElementById(
"typingSentence"
).textContent=
sentences[
typingIndex
];

document.getElementById(
"typingBox"
).value="";

document.getElementById(
"typingMessage"
).textContent="";

document.getElementById(
"nextTypingBtn"
).style.display=
"none";

}

document
.getElementById(
"typingBox"
)
.addEventListener(
"input",
function(){

if(
this.value
.trim()
.toLowerCase()
===
sentences[
typingIndex
]
.toLowerCase()
){

document.getElementById(
"typingMessage"
).textContent=
"🎉 Great typing!";

document.getElementById(
"nextTypingBtn"
).style.display=
"inline-block";

speak(
"Great typing"
);

}

}
);

function nextTyping(){

typingIndex++;

if(
typingIndex<
sentences.length
){

loadTyping();

}else{

speak(
"Finished typing"
);

}

}

</script>

</body>
