<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Sentence Learning System
</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial;
background:#eaf6f3;
}

.container{
max-width:900px;
margin:auto;
}

.section{
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 4px 12px #bbb;
}

h1{
text-align:center;
font-size:42px;
}

button{
width:100%;
padding:22px;
font-size:32px;
margin-top:15px;
border:none;
border-radius:20px;
background:#8fc8b7;
cursor:pointer;
}

.sentence{
font-size:34px;
font-weight:bold;
margin:20px 0;
}

.word-bank,
.target{

display:flex;

flex-wrap:wrap;

gap:10px;

min-height:90px;

padding:15px;

border-radius:18px;

}

.word-bank{
background:#dff2eb;
}

.target{
background:#fff3cc;
margin-top:15px;
}

.word{

background:#b7d9ff;

padding:14px;

border-radius:14px;

font-size:28px;

cursor:pointer;

}

input{

width:100%;

font-size:28px;

padding:18px;

border-radius:15px;

box-sizing:border-box;

}

.message{

font-size:30px;

font-weight:bold;

margin-top:20px;

}

</style>

</head>

<body>

<div class="container">

<h1>
Sentence Learning System 🔊
</h1>

<div
class="section"
id="start">

<button
onclick="startPuzzle()">

🧩 Puzzles

</button>

<button
onclick="startTyping()">

✏️ Typing

</button>

</div>

<div
class="section"
id="puzzleSection"

style="display:none;">

<h2 id="counter"></h2>

<div
id="sentence"

class="sentence">

</div>

<button
onclick="readPuzzle()">

🔊 Read

</button>

<div
id="bank"

class="word-bank">

</div>

<div
id="target"

class="target">

</div>

<button
onclick="checkPuzzle()">

Check ✅

</button>

<button
id="nextPuzzle"

style="display:none"

onclick="nextPuzzle()">

Next ➡️

</button>

<div
id="message"

class="message">

</div>

</div>

<div
class="section"

id="typingSection"

style="display:none;">

<h2 id="typingCounter"></h2>

<div
id="typingSentence"

class="sentence">

</div>

<button
onclick="readTyping()">

🔊 Read

</button>

<input
id="typingBox">

<div
id="typingMessage"

class="message">

</div>

<button
id="nextTyping"

style="display:none"

onclick="nextTyping()">

Next ➡️

</button>

</div>

</div>

<script>

const sentences=[

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];

let puzzle=0;
let typing=0;

function speak(text){

speechSynthesis.cancel();

speechSynthesis.speak(

new SpeechSynthesisUtterance(
text
)

);

}

function startPuzzle(){

document
.getElementById(
"start"
)
.style.display=
"none";

document
.getElementById(
"puzzleSection"
)
.style.display=
"block";

loadPuzzle();

}

function startTyping(){

document
.getElementById(
"start"
)
.style.display=
"none";

document
.getElementById(
"typingSection"
)
.style.display=
"block";

loadTyping();

}

function loadPuzzle(){

document
.getElementById(
"counter"
)
.textContent=
`Puzzle ${puzzle+1}`;

document
.getElementById(
"sentence"
)
.textContent=
sentences[puzzle];

document
.getElementById(
"bank"
)
.innerHTML="";

document
.getElementById(
"target"
)
.innerHTML="";

document
.getElementById(
"message"
)
.textContent="";

document
.getElementById(
"nextPuzzle"
)
.style.display=
"none";

let words=
[
...sentences[puzzle]
.split(" ")
];

words.sort(
()=>Math.random()-.5
);

words.forEach(word=>{

let div=
document
.createElement(
"div"
);

div.className=
"word";

div.textContent=
word;

div.onclick=
()=>{

let bank=
document
.getElementById(
"bank"
);

let target=
document
.getElementById(
"target"
);

if(
div.parentNode===
bank
){

target
.appendChild(
div
);

}else{

bank
.appendChild(
div
);

}

speak(word);

};

document
.getElementById(
"bank"
)
.appendChild(
div
);

});

}

function checkPuzzle(){

let answer=

[
...
document
.getElementById(
"target"
)
.children
]

.map(
x=>
x.textContent
)

.join(" ");

if(

answer
.toLowerCase()

===

sentences[
puzzle
]
.toLowerCase()

){

document
.getElementById(
"message"
)
.textContent=
"🎉 Correct!";

document
.getElementById(
"nextPuzzle"
)
.style.display=
"block";

}else{

document
.getElementById(
"message"
)
.textContent=
"Try again";

}

}

function nextPuzzle(){

puzzle++;

if(
puzzle<
sentences.length
){

loadPuzzle();

}else{

document
.getElementById(
"message"
)
.textContent=
"🎉 Finished";

}

}

function readPuzzle(){

speak(
sentences[
puzzle
]
);

}

function loadTyping(){

document
.getElementById(
"typingCounter"
)
.textContent=
`Typing ${typing+1}`;

document
.getElementById(
"typingSentence"
)
.textContent=
sentences[
typing
];

document
.getElementById(
"typingBox"
)
.value="";

}

function readTyping(){

speak(
sentences[
typing
]
);

}

document
.getElementById(
"typingBox"
)

.addEventListener(
"input",

function(){

if(

this
.value
.trim()
.toLowerCase()

===

sentences[
typing
]
.toLowerCase()

){

document
.getElementById(
"typingMessage"
)
.textContent=
"🎉 Correct";

document
.getElementById(
"nextTyping"
)
.style.display=
"block";

}

}

);

function nextTyping(){

typing++;

if(
typing<
sentences.length
){

loadTyping();

}else{

document
.getElementById(
"typingMessage"
)
.textContent=
"🎉 Finished";

}

}

</script>

</body>

</html>
