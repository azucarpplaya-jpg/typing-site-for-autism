<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Learning System</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef5ff;
}

.screen{

display:flex;

justify-content:center;

padding:25px;

min-height:100vh;

}

.card{

width:100%;

max-width:900px;

background:white;

border-radius:30px;

padding:30px;

box-shadow:
0 12px 30px
rgba(0,0,0,.08);

}

h1,h2{
text-align:center;
}

.grid{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(
160px,
1fr
));

gap:18px;

}

.box{

height:150px;

display:flex;

align-items:center;

justify-content:center;

border-radius:28px;

font-size:34px;

font-weight:bold;

cursor:pointer;

color:white;

background:
linear-gradient(
135deg,
#69a8ff,
#5fd8bf
);

}

.box:active{
transform:scale(.98);
}

.sentence{

font-size:38px;

text-align:center;

margin:30px 0;

line-height:1.4;

}

button{

width:100%;

padding:22px;

font-size:28px;

border:none;

border-radius:22px;

background:#69a8ff;

color:white;

cursor:pointer;

margin-top:18px;

}

input{

width:100%;

font-size:34px;

padding:22px;

border-radius:22px;

border:3px solid #d8e5ff;

}

.words{

display:flex;

flex-wrap:wrap;

gap:14px;

padding:18px;

border-radius:22px;

min-height:110px;

}

#bank{
background:#edf7ff;
}

#target{
background:#fff6d9;
margin-top:20px;
}

.word{

background:white;

padding:16px;

font-size:30px;

border-radius:18px;

cursor:pointer;

}

.good{

font-size:56px;

text-align:center;

margin-top:60px;

}

.small{

font-size:26px;

text-align:center;

color:#666;

}

</style>

</head>

<body>

<!-- MODE -->

<div
class="screen"
id="modeScreen">

<div class="card">

<h1>

Sentence Learning

</h1>

<div class="grid">

<div
class="box"
onclick="choose('typing')">

✏️ Typing

</div>

<div
class="box"
onclick="choose('puzzle')">

🧩 Puzzle

</div>

</div>

</div>

</div>

<!-- LESSONS -->

<div
class="screen"
id="lessonScreen"

style="display:none">

<div class="card">

<h1>

Choose Lesson

</h1>

<div
class="grid"
id="lessonGrid">

</div>

</div>

</div>

<!-- ACTIVITY -->

<div
class="screen"
id="activity"

style="display:none">

<div class="card">

<h2
id="counter">

</h2>

<div
class="sentence"
id="sentence">

</div>

<button
onclick="readSentence()">

🔊 Read

</button>

<div
id="typingArea">

<input
id="typingInput"

placeholder="Type here">

</div>

<div
id="puzzleArea"

style="display:none">

<div
class="words"
id="bank">

</div>

<div
class="words"
id="target">

</div>

<button
onclick="checkPuzzle()">

Check ✅

</button>

</div>

</div>

</div>

<!-- GOOD -->

<div
class="screen"
id="good"

style="display:none">

<div class="card">

<div class="good">

🎉 Good Job!

</div>

<div class="small">

Ready for the next one?

</div>

<button
onclick="nextLesson()">

Keep Going ➡️

</button>

</div>

</div>

<script>

const lessons=[

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];

let mode="typing";

let current=0;

let lastWord="";

/* SPEAK */

function speak(text){

speechSynthesis.cancel();

let u=
new SpeechSynthesisUtterance(
text
);

u.rate=.85;

speechSynthesis.speak(
u
);

}

/* MODE */

function choose(m){

mode=m;

document
.getElementById(
"modeScreen"
)
.style.display=
"none";

document
.getElementById(
"lessonScreen"
)
.style.display=
"flex";

drawLessons();

}

/* LESSON BOXES */

function drawLessons(){

let grid=
document
.getElementById(
"lessonGrid"
);

grid.innerHTML="";

lessons.forEach(
(
x,
i
)=>{

let box=
document
.createElement(
"div"
);

box.className=
"box";

box.textContent=
i+1;

box.onclick=
()=>{

current=i;

openLesson();

};

grid.appendChild(
box
);

});

}

/* OPEN */

function openLesson(){

document
.getElementById(
"lessonScreen"
)
.style.display=
"none";

document
.getElementById(
"good"
)
.style.display=
"none";

document
.getElementById(
"activity"
)
.style.display=
"flex";

document
.getElementById(
"counter"
)
.textContent=

`${mode==="typing"
?
"Lesson"
:
"Puzzle"}

 ${
current+1
}`;

document
.getElementById(
"sentence"
)
.textContent=
lessons[
current
];

if(
mode==="typing"
){

startTyping();

}

else{

startPuzzle();

}

}

function readSentence(){

speak(
lessons[
current
]
);

}

/* TYPING */

function startTyping(){

document
.getElementById(
"typingArea"
)
.style.display=
"block";

document
.getElementById(
"puzzleArea"
)
.style.display=
"none";

let input=
document
.getElementById(
"typingInput"
);

input.value="";

input.focus();

lastWord="";

}

document
.getElementById(
"typingInput"
)

.addEventListener(
"input",

function(){

let text=
this.value;

let words=
text
.trim()
.split(/\s+/);

let newest=
words[
words.length-1
];

if(

text.endsWith(" ")

&&

newest

&&

newest!==lastWord

){

lastWord=
newest;

speak(
newest
);

}

if(

text
.trim()
.toLowerCase()

===

lessons[
current
]
.toLowerCase()

){

finish();

}

}

);

/* PUZZLE */

function startPuzzle(){

document
.getElementById(
"typingArea"
)
.style.display=
"none";

document
.getElementById(
"puzzleArea"
)
.style.display=
"block";

let bank=
document
.getElementById(
"bank"
);

let target=
document
.getElementById(
"target"
);

bank.innerHTML="";
target.innerHTML="";

let words=
[
...
lessons[
current
]
.split(" ")
];

words.sort(
()=>Math.random()-.5
);

words.forEach(
word=>{

let tile=
document
.createElement(
"div"
);

tile.className=
"word";

tile.textContent=
word;

tile.onclick=
()=>{

if(
tile.parentNode===
bank
){

target
.appendChild(
tile
);

}
else{

bank
.appendChild(
tile
);

}

speak(
word
);

};

bank.appendChild(
tile
);

});

}

function checkPuzzle(){

let answer=

[
...
document
.getElementById(
"target"
)
.children
]

.map(
x=>
x.textContent
)

.join(
" "
);

if(

answer
.toLowerCase()

===

lessons[
current
]
.toLowerCase()

){

finish();

}

}

/* FINISH */

function finish(){

document
.getElementById(
"activity"
)
.style.display=
"none";

document
.getElementById(
"good"
)
.style.display=
"flex";

}

function nextLesson(){

current++;

if(
current<
lessons.length
){

openLesson();

}

else{

document.body.innerHTML=

`
<div class="screen">
<div class="card">
<div class="good">
🏆 Finished All Lessons
</div>
</div>
</div>
`;

}

}

</script>

</body>

</html>
