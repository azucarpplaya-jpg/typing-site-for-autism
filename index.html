<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Sentence Learning System
</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial;
background:#eaf6f3;
}

.container{
max-width:900px;
margin:auto;
}

.section{
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 4px 12px #bbb;
}

h1{
text-align:center;
}

button{

width:100%;

padding:22px;

font-size:30px;

margin-top:15px;

border:none;

border-radius:18px;

background:#8fc8b7;

cursor:pointer;

}

.sentence{

font-size:34px;

font-weight:bold;

margin:20px 0;

}

.word-bank,
.target{

display:flex;

flex-wrap:wrap;

gap:12px;

padding:15px;

border-radius:18px;

min-height:100px;

}

.word-bank{
background:#dff2eb;
}

.target{
background:#fff4cc;
}

.word{

background:#b7d9ff;

padding:14px;

font-size:28px;

border-radius:14px;

cursor:pointer;

}

input{

width:100%;

padding:18px;

font-size:28px;

border-radius:18px;

box-sizing:border-box;

}

.message{

font-size:30px;

font-weight:bold;

margin-top:20px;

}

</style>

</head>

<body>

<div class="container">

<h1>
Sentence Learning System 🔊
</h1>

<div
class="section"
id="startScreen">

<button onclick="openPuzzle()">

🧩 Puzzles

</button>

<button onclick="openTyping()">

✏️ Typing

</button>

</div>

<div
class="section"
id="puzzleScreen"

style="display:none">

<h2 id="puzzleCount"></h2>

<div
class="sentence"
id="puzzleSentence">

</div>

<button
onclick="readPuzzle()">

🔊 Read

</button>

<div
class="word-bank"
id="wordBank">

</div>

<div
class="target"
id="targetArea">

</div>

<button
onclick="checkPuzzle()">

Check ✅

</button>

<button
id="nextPuzzleButton"

style="display:none"

onclick="nextPuzzle()">

Keep Going ➡️

</button>

<div
class="message"
id="puzzleMessage">

</div>

</div>

<div
class="section"
id="typingScreen"

style="display:none">

<h2 id="typingCount"></h2>

<div
class="sentence"
id="typingSentence">

</div>

<button
onclick="readTyping()">

🔊 Read

</button>

<input
id="typingInput"

placeholder="Type sentence">

<div
class="message"
id="typingMessage">

</div>

<button
id="nextTypingButton"

style="display:none"

onclick="nextTyping()">

Keep Going ➡️

</button>

</div>

</div>

<script>

const sentences=[

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];

let puzzle=0;

let typing=0;

let lastWord="";

/* SPEAK */

function speak(text){

speechSynthesis.cancel();

speechSynthesis.speak(
new SpeechSynthesisUtterance(
text
));

}

/* START */

function openPuzzle(){

document
.getElementById(
"startScreen"
)
.style.display=
"none";

document
.getElementById(
"puzzleScreen"
)
.style.display=
"block";

loadPuzzle();

}

function openTyping(){

document
.getElementById(
"startScreen"
)
.style.display=
"none";

document
.getElementById(
"typingScreen"
)
.style.display=
"block";

loadTyping();

}

/* PUZZLE */

function loadPuzzle(){

document
.getElementById(
"puzzleCount"
)
.textContent=

`Puzzle ${
puzzle+1
} of ${
sentences.length
}`;

document
.getElementById(
"puzzleSentence"
)
.textContent=
sentences[puzzle];

document
.getElementById(
"wordBank"
)
.innerHTML="";

document
.getElementById(
"targetArea"
)
.innerHTML="";

document
.getElementById(
"nextPuzzleButton"
)
.style.display=
"none";

document
.getElementById(
"puzzleMessage"
)
.textContent="";

let words=

sentences[
puzzle
]

.split(" ")

.sort(
()=>Math.random()-.5
);

words.forEach(word=>{

let tile=
document
.createElement(
"div"
);

tile.className=
"word";

tile.textContent=
word;

tile.onclick=
()=>{

let bank=
document
.getElementById(
"wordBank"
);

let target=
document
.getElementById(
"targetArea"
);

if(
tile.parentNode===
bank
){

target
.appendChild(
tile
);

}else{

bank
.appendChild(
tile
);

}

speak(
word
);

};

document
.getElementById(
"wordBank"
)
.appendChild(
tile
);

});

}

function readPuzzle(){

speak(
sentences[
puzzle
]
);

}

function checkPuzzle(){

let answer=

[
...
document
.getElementById(
"targetArea"
)
children
]

.map(
x=>
x.textContent
)

.join(" ");

if(

answer
.toLowerCase()

===

sentences[
puzzle
]
.toLowerCase()

){

document
.getElementById(
"puzzleMessage"
)
.textContent=
"🎉 Correct";

document
.getElementById(
"nextPuzzleButton"
)
.style.display=
"block";

}

}

/* NEXT */

function nextPuzzle(){

puzzle++;

if(
puzzle<
sentences.length
){

loadPuzzle();

}

}

/* TYPING */

function loadTyping(){

document
.getElementById(
"typingCount"
)
.textContent=

`Typing ${
typing+1
} of ${
sentences.length
}`;

document
.getElementById(
"typingSentence"
)
.textContent=
sentences[
typing
];

document
.getElementById(
"typingInput"
)
.value="";

document
.getElementById(
"typingMessage"
)
.textContent="";

document
.getElementById(
"nextTypingButton"
)
.style.display=
"none";

lastWord="";

}

document
.getElementById(
"typingInput"
)

.addEventListener(
"input",

function(){

let text=
this.value;

let words=
text
.trim()
.split(/\s+/);

let newest=
words[
words.length-1
];

if(

text.endsWith(" ")

&&

newest

&&

newest!==lastWord

){

lastWord=
newest;

speak(
newest
);

}

if(

text
.trim()
.toLowerCase()

===

sentences[
typing
]
.toLowerCase()

){

document
.getElementById(
"typingMessage"
)
.textContent=
"🎉 Great typing!";

document
.getElementById(
"nextTypingButton"
)
.style.display=
"block";

}

}

);

function readTyping(){

speak(
sentences[
typing
]
);

}

function nextTyping(){

typing++;

if(
typing<
sentences.length
){

loadTyping();

}

}

</script>

</body>
</html>
