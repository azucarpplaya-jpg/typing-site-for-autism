<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Sentence Learning System</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial;
background:#eaf6f3;
}

.container{
max-width:900px;
margin:auto;
}

.section{

background:white;

padding:30px;

border-radius:24px;

box-shadow:0 4px 12px #bbb;

}

button{

width:100%;

padding:22px;

font-size:28px;

margin-top:15px;

border:none;

border-radius:18px;

background:#8fc8b7;

cursor:pointer;

}

.sentence{

font-size:34px;

font-weight:bold;

margin:20px 0;

}

.word-bank,
.target{

display:flex;

flex-wrap:wrap;

gap:12px;

padding:15px;

border-radius:18px;

min-height:100px;

}

.word-bank{
background:#dff2eb;
}

.target{
background:#fff6cf;
}

.word{

background:#b7d9ff;

padding:14px;

border-radius:14px;

font-size:28px;

cursor:pointer;

}

input{

width:100%;

padding:18px;

font-size:28px;

border-radius:18px;

box-sizing:border-box;

}

.message{

font-size:30px;

font-weight:bold;

margin-top:15px;

}

</style>

</head>

<body>

<div class="container">

<div
class="section"
id="menu">

<h1>
Sentence Learning System 🔊
</h1>

<button id="lessonBtn">

✏️ Lessons

</button>

<button id="puzzleBtn">

🧩 Puzzles

</button>

</div>

<!-- LESSON -->

<div
class="section"
id="lesson"

style="display:none;">

<h2 id="lessonCount"></h2>

<div
id="lessonSentence"

class="sentence">

</div>

<button id="lessonRead">

🔊 Read

</button>

<input
id="lessonInput"

placeholder="Type sentence">

<div
id="lessonMsg"

class="message">

</div>

<button
id="lessonNext"

style="display:none;">

Keep Going ➡️

</button>

</div>

<!-- PUZZLE -->

<div
class="section"
id="puzzle"

style="display:none;">

<h2 id="puzzleCount"></h2>

<div
id="puzzleSentence"

class="sentence">

</div>

<button id="puzzleRead">

🔊 Read

</button>

<div
id="bank"

class="word-bank">

</div>

<div
id="target"

class="target">

</div>

<button id="checkPuzzle">

Check ✅

</button>

<div
id="puzzleMsg"

class="message">

</div>

<button
id="puzzleNext"

style="display:none;">

Keep Going ➡️

</button>

</div>

</div>

<script>

const lessons=[

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];

let lesson=0;

let puzzle=0;

let lastWord="";

function speak(text){

speechSynthesis.cancel();

speechSynthesis.speak(
new SpeechSynthesisUtterance(
text
));

}

/* OPEN */

document
.getElementById(
"lessonBtn"
)

.onclick=
()=>{

menu.style.display=
"none";

lesson.style.display=
"block";

loadLesson();

};

document
.getElementById(
"puzzleBtn"
)

.onclick=
()=>{

menu.style.display=
"none";

puzzle.style.display=
"block";

loadPuzzle();

};

/* LESSON */

function loadLesson(){

document
.getElementById(
"lessonCount"
)
.textContent=

`Lesson ${
lesson+1
} of ${
lessons.length
}`;

document
.getElementById(
"lessonSentence"
)
.textContent=
lessons[
lesson
];

document
.getElementById(
"lessonInput"
)
.value="";

document
.getElementById(
"lessonMsg"
)
.textContent="";

document
.getElementById(
"lessonNext"
)
.style.display=
"none";

lastWord="";

}

lessonRead.onclick=
()=>{

speak(
lessons[
lesson
]
);

};

lessonInput
.addEventListener(
"input",

function(){

let text=
this.value;

let words=
text
.trim()
.split(/\s+/);

let newest=
words[
words.length-1
];

if(

text.endsWith(" ")

&&

newest

&&

newest!==lastWord

){

lastWord=
newest;

speak(
newest
);

}

if(

text
.trim()
.toLowerCase()

===

lessons[
lesson
]
.toLowerCase()

){

lessonMsg.textContent=
"🎉 Great lesson!";

lessonNext.style.display=
"block";

}

}

);

lessonNext.onclick=
()=>{

lesson++;

if(
lesson<
lessons.length
){

loadLesson();

}

};

/* PUZZLE */

function loadPuzzle(){

puzzleCount.textContent=

`Puzzle ${
puzzle+1
} of ${
lessons.length
}`;

puzzleSentence.textContent=

lessons[
puzzle
];

bank.innerHTML="";

target.innerHTML="";

puzzleMsg.textContent="";

puzzleNext.style.display=
"none";

let words=

[
...
lessons[
puzzle
]

.split(" ")
];

words.sort(
()=>Math.random()-.5
);

words.forEach(word=>{

let div=
document
.createElement(
"div"
);

div.className=
"word";

div.textContent=
word;

div.onclick=
()=>{

if(
div.parentNode===
bank
){

target
.appendChild(
div
);

}

else{

bank
.appendChild(
div
);

}

speak(
word
);

};

bank
.appendChild(
div
);

});

}

puzzleRead.onclick=
()=>{

speak(
lessons[
puzzle
]
);

};

checkPuzzle.onclick=
()=>{

let answer=

[
...
target.children
]

.map(
x=>
x.textContent
)

.join(" ");

if(

answer
.toLowerCase()

===

lessons[
puzzle
]
.toLowerCase()

){

puzzleMsg.textContent=
"🎉 Great puzzle!";

puzzleNext.style.display=
"block";

}

};

puzzleNext.onclick=
()=>{

puzzle++;

if(
puzzle<
lessons.length
){

loadPuzzle();

}

};

</script>

</body>

</html>
