<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning System</title>

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef5ff;
}

.screen{
display:flex;
justify-content:center;
padding:25px;
min-height:100vh;
}

.card{
width:100%;
max-width:900px;
background:white;
padding:30px;
border-radius:30px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:18px;
}

.box{
height:150px;
border-radius:25px;
display:flex;
justify-content:center;
align-items:center;
font-size:36px;
font-weight:bold;
background:linear-gradient(135deg,#69a8ff,#5fd8bf);
color:white;
cursor:pointer;
}

.sentence{
font-size:36px;
text-align:center;
margin:25px 0;
}

button{
width:100%;
padding:22px;
font-size:28px;
border:none;
border-radius:22px;
background:#69a8ff;
color:white;
margin-top:15px;
}

input{
width:100%;
padding:20px;
font-size:30px;
border-radius:20px;
}

.words{
display:flex;
flex-wrap:wrap;
gap:12px;
padding:18px;
border-radius:20px;
min-height:120px;
}

#bank{
background:#edf7ff;
}

#target{
background:#fff6d9;
margin-top:20px;
}

.word{
background:white;
padding:16px;
border-radius:18px;
font-size:30px;
cursor:pointer;
}

.good{
font-size:52px;
text-align:center;
}

</style>

</head>

<body>

<div class="screen" id="mode">

<div class="card">

<h1>Choose Activity</h1>

<div class="grid">

<div
class="box"
onclick="choose('typing')">

✏️

</div>

<div
class="box"
onclick="choose('puzzle')">

🧩

</div>

</div>

</div>

</div>

<div
class="screen"
id="lessons"

style="display:none">

<div class="card">

<h1>Choose Lesson</h1>

<div
class="grid"
id="lessonGrid">

</div>

</div>

</div>

<div
class="screen"
id="activity"

style="display:none">

<div class="card">

<h2 id="counter"></h2>

<div
class="sentence"
id="sentence">

</div>

<button onclick="readSentence()">

🔊 Read

</button>

<div id="typingArea">

<input
id="typingInput">

</div>

<div
id="puzzleArea"

style="display:none">

<div
id="bank"

class="words">

</div>

<div
id="target"

class="words">

</div>

<button
onclick="checkPuzzle()">

Check

</button>

</div>

</div>

</div>

<div
class="screen"
id="good"

style="display:none">

<div class="card">

<div class="good">

🎉 Good Job!

</div>

<button
onclick="nextLesson()">

Keep Going ➡️

</button>

</div>

</div>

<script>

const lessons=[

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];

let current=0;

let mode="typing";

let lastWord="";

function speak(text){

let u=
new SpeechSynthesisUtterance(
text
);

u.rate=.85;

speechSynthesis.speak(
u
);

}

function choose(m){

mode=m;

modeScreen=
document.getElementById(
"mode"
);

modeScreen.style.display=
"none";

document
.getElementById(
"lessons"
)
.style.display=
"flex";

drawLessons();

}

function drawLessons(){

let grid=
document
.getElementById(
"lessonGrid"
);

grid.innerHTML="";

lessons.forEach(
(
x,
i
)=>{

let d=
document
.createElement(
"div"
);

d.className=
"box";

d.textContent=
i+1;

d.onclick=
()=>{

current=i;

open();

};

grid.appendChild(
d
);

});

}

function open(){

lessonsScreen=
document
.getElementById(
"lessons"
);

lessonsScreen.style.display=
"none";

document
.getElementById(
"good"
)
.style.display=
"none";

document
.getElementById(
"activity"
)
.style.display=
"flex";

counter.textContent=
`${mode} ${current+1}`;

sentence.textContent=
lessons[current];

if(
mode==="typing"
){

typing();

}

else{

puzzle();

}

}

function readSentence(){

speak(
lessons[
current
]
);

}

/* TYPING */

function typing(){

typingArea.style.display=
"block";

puzzleArea.style.display=
"none";

typingInput.value="";

typingInput.focus();

}

typingInput
.addEventListener(
"input",

function(){

let t=
this.value;

let words=
t.trim()
.split(/\s+/);

let newest=
words[
words.length-1
];

if(

t.endsWith(" ")

&&

newest

&&

newest!==lastWord

){

lastWord=
newest;

speak(
newest
);

}

if(

t.trim()
.toLowerCase()

===

lessons[
current
]
.toLowerCase()

){

finish();

}

}

/* PUZZLE */

);

function puzzle(){

typingArea.style.display=
"none";

puzzleArea.style.display=
"block";

bank.innerHTML="";

target.innerHTML="";

let words=
[
...
lessons[
current
]
.split(" ")
];

words.sort(
()=>Math.random()-.5
);

words.forEach(
word=>{

let tile=
document
.createElement(
"div"
);

tile.className=
"word";

tile.textContent=
word;

tile.addEventListener(
"click",

()=>{

speak(
word
);

/* WAIT */

setTimeout(
()=>{

if(
tile.parentNode===
bank
){

target.appendChild(
tile
);

}

else{

bank.appendChild(
tile
);

}

},
120
);

}

);

bank.appendChild(
tile
);

});

}

function checkPuzzle(){

let made=

[
...
target.children
]

.map(
x=>
x.textContent
)

.join(" ");

if(

made
.toLowerCase()

===

lessons[
current
]
.toLowerCase()

){

finish();

}

}

function finish(){

activity.style.display=
"none";

good.style.display=
"flex";

}

function nextLesson(){

current++;

if(
current<
lessons.length
){

open();

}

}

</script>

</body>

</html>
