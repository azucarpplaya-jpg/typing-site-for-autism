<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sentence Puzzle</title>

<style>

body {
    font-family: Arial, "Comic Sans MS", sans-serif;
    background:#eaf6f3;
    padding:30px;
}

.container {
    max-width:900px;
    margin:auto;
}

.section {
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:30px;
    box-shadow:0 4px 12px #aaa;
}

h1 {
    color:#234;
}

.sentence {
    font-size:34px;
    font-weight:bold;
}

button {
    font-size:24px;
    padding:12px 20px;
    margin:8px;
    border:none;
    border-radius:15px;
    background:#8fc8b7;
    cursor:pointer;
}

.word-bank, .target {
    min-height:100px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    padding:15px;
    border-radius:15px;
}

.word-bank {
    background:#dff2eb;
}

.target {
    background:#fff7d6;
}

.word {
    background:#b7d9ff;
    padding:15px 20px;
    border-radius:12px;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
}

.correct {
    background:#b8efb8;
}

input {
    width:100%;
    font-size:28px;
    padding:12px;
    border-radius:12px;
    border:3px solid #9fb;
}

#message {
    font-size:30px;
    font-weight:bold;
}

</style>

</head>


<body>


<div class="container">


<h1>Sentence Puzzle 🔊</h1>



<div class="section">

<h2>Sentence</h2>

<div id="sentence" class="sentence"></div>


<button onclick="readSentence()">
🔊 Read Sentence
</button>

</div>




<div class="section">

<h2>Build the sentence</h2>


<div id="bank" class="word-bank"></div>


<h3>Your Sentence</h3>

<div id="target" class="target"></div>


<button onclick="check()">
Check ✅
</button>


<button id="nextButton" onclick="nextSentence()" style="display:none;">
Keep Going ➡️
</button>


<div id="message"></div>

</div>





<!-- TYPING PART -->

<div class="section" id="typingSection" style="display:none;">


<h2>Typing Practice ✏️</h2>


<div id="typingSentence" class="sentence"></div>


<button onclick="readTyping()">
🔊 Read Sentence
</button>


<input id="typingBox" placeholder="Type the sentence here...">


<div id="typingMessage"></div>


</div>




</div>






<script>


const sentences = [

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];



let current = 0;



const speech = window.speechSynthesis;



function speak(text){

speech.cancel();

let voice = new SpeechSynthesisUtterance(text);

voice.rate = 0.75;
voice.pitch = 1;

speech.speak(voice);

}





function readSentence(){

speak(sentences[current]);

}






function loadGame(){


document.getElementById("sentence").textContent =
sentences[current];


document.getElementById("message").textContent="";


document.getElementById("nextButton").style.display="none";



let bank=document.getElementById("bank");

let target=document.getElementById("target");


bank.innerHTML="";
target.innerHTML="";


target.classList.remove("correct");



let words = sentences[current].split(" ");


words.sort(()=>Math.random()-0.5);



words.forEach(word=>{


let tile=document.createElement("div");


tile.className="word";

tile.textContent=word;



tile.onclick=function(){


if(tile.parentNode==bank){

target.appendChild(tile);

speak(word);

}

else{

bank.appendChild(tile);

}


};



bank.appendChild(tile);



});


}







function check(){


let made =
[...document.getElementById("target").children]
.map(x=>x.textContent.trim())
.join(" ")
.trim()
.toLowerCase();



let correct =
sentences[current]
.trim()
.toLowerCase();




if(made === correct){


document.getElementById("message").textContent =
"🎉 Great job!";


document.getElementById("target")
.classList.add("correct");


speak("Great job!");



document.getElementById("nextButton")
.style.display="inline-block";


}

else{


document.getElementById("message").textContent =
"Try again";


speak("Try again");


}


}







function nextSentence(){


current++;



if(current >= sentences.length){



document.getElementById("message")
.textContent =
"You finished all the puzzles! 🎉 Now let's do some typing.";


speak("You finished all the puzzles. Now let's do some typing.");



document.getElementById("typingSection")
.style.display="block";



document.getElementById("typingSentence")
.textContent =
sentences[0];


return;


}



loadGame();


}








function readTyping(){

speak(
document.getElementById("typingSentence").textContent
);

}




document.getElementById("typingBox")
.addEventListener("input", function(){


let typed =
this.value.trim().toLowerCase();


let answer =
document.getElementById("typingSentence")
.textContent
.toLowerCase();



if(typed === answer){


document.getElementById("typingMessage")
.textContent =
"🎉 Great typing!";


speak("Great typing");


}


});







loadGame();



</script>


</body>
</html>
