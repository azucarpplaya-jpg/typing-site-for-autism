<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sentence Puzzle</title>


<style>

body {
    font-family: Arial, "Comic Sans MS", sans-serif;
    background:#eaf6f3;
    padding:30px;
}


.container {
    max-width:900px;
    margin:auto;
}


.section {
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:30px;
    box-shadow:0 4px 12px #aaa;
}


h1 {
    color:#234;
}


.sentence {
    font-size:34px;
    font-weight:bold;
}


button {

    font-size:24px;
    padding:12px 20px;
    margin:8px;
    border:none;
    border-radius:15px;
    background:#8fc8b7;
    cursor:pointer;

}


button:hover {

    background:#6fb09e;

}



.word-bank, .target {

    min-height:100px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    padding:15px;
    border-radius:15px;

}



.word-bank {

    background:#dff2eb;

}



.target {

    background:#fff7d6;

}



.word {

    background:#b7d9ff;
    padding:15px 20px;
    border-radius:12px;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;

}



.word:hover {

    background:#90bdf0;

}



.correct {

    background:#b8efb8;

}



#message {

    font-size:32px;
    font-weight:bold;
    margin-top:20px;

}


</style>

</head>



<body>


<div class="container">


<h1>Sentence Puzzle 🔊</h1>



<div class="section">


<h2>Sentence</h2>


<div id="sentence" class="sentence"></div>


<button onclick="readSentence()">
🔊 Read Sentence
</button>


</div>





<div class="section">


<h2>Build the sentence</h2>


<p>Put the words in the correct order.</p>


<div id="bank" class="word-bank"></div>


<h3>Your Sentence:</h3>


<div id="target" class="target"></div>



<button onclick="check()">
Check ✅
</button>


<button id="nextButton" onclick="nextSentence()" style="display:none;">
Keep Going ➡️
</button>



<div id="message"></div>


</div>



</div>





<script>


const sentences = [


"I like to eat watermelon every day",


"My name is Adi",


"I love pasta to eat when appa makes it",


"My brothers name is Sid",


"I go to CABI school"


];



let current = 0;



const speech = window.speechSynthesis;




function speak(text){

    speech.cancel();


    let voice = new SpeechSynthesisUtterance(text);


    voice.rate = 0.75;
    voice.pitch = 1;


    speech.speak(voice);

}





function readSentence(){

    speak(sentences[current]);

}







function loadGame(){


    document.getElementById("sentence").textContent =
    sentences[current];


    document.getElementById("message").textContent="";


    document.getElementById("nextButton").style.display="none";


    let bank =
    document.getElementById("bank");


    let target =
    document.getElementById("target");


    bank.innerHTML="";
    target.innerHTML="";


    target.classList.remove("correct");



    let words =
    sentences[current].split(" ");



    words.sort(()=>Math.random()-0.5);




    words.forEach(word=>{


        let piece =
        document.createElement("div");


        piece.className="word";


        piece.textContent=word;




        piece.onclick=function(){


            if(piece.parentNode==bank){


                target.appendChild(piece);


                speak(word);


            }
            else {


                bank.appendChild(piece);


            }


        };



        bank.appendChild(piece);



    });



}








function check(){



let made =
[...document.getElementById("target").children]


.map(x=>x.textContent.trim())


.join(" ")


.trim()


.toLowerCase();





let correct =
sentences[current]


.trim()


.toLowerCase();





if(made === correct){



    document.getElementById("message").textContent =
    "🎉 Great job!";


    document.getElementById("target")
    .classList.add("correct");



    speak("Great job!");



    document.getElementById("nextButton")
    .style.display="inline-block";



}

else {



    document.getElementById("message").textContent =
    "Try again";


    speak("Try again");


}



}







function nextSentence(){



current++;




if(current >= sentences.length){



document.getElementById("message")
.textContent =
"You finished all the puzzles! 🎉";


speak("You finished all the puzzles");


current=0;


return;


}



loadGame();



}






loadGame();



</script>



</body>
</html>
