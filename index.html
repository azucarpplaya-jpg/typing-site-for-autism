<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Sentence Learning System
</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial;
background:#eaf6f3;
}

.container{
max-width:900px;
margin:auto;
}

.section{
background:white;
padding:30px;
border-radius:24px;
box-shadow:0 4px 10px #bbb;
}

button{

width:100%;

padding:22px;

font-size:28px;

margin-top:15px;

border:none;

border-radius:18px;

background:#8fc8b7;

cursor:pointer;

}

.sentence{

font-size:34px;

font-weight:bold;

margin:20px 0;

}

.word-bank,
.target{

display:flex;

flex-wrap:wrap;

gap:12px;

padding:15px;

border-radius:18px;

min-height:100px;

}

.word-bank{
background:#dff2eb;
}

.target{
background:#fff6cf;
}

.word{

background:#b7d9ff;

padding:14px;

border-radius:14px;

font-size:28px;

cursor:pointer;

}

input{

width:100%;

padding:18px;

font-size:28px;

border-radius:18px;

box-sizing:border-box;

}

.message{

font-size:28px;

font-weight:bold;

margin-top:15px;

}

</style>

</head>

<body>

<div class="container">

<div
class="section"
id="home">

<h1>
Sentence Learning System 🔊
</h1>

<button
onclick="openLessons()">

✏️ Lessons

</button>

<button
onclick="openPuzzles()">

🧩 Puzzles

</button>

</div>

<div
class="section"
id="lessonScreen"

style="display:none;">

<h2 id="lessonCounter"></h2>

<div
class="sentence"
id="lessonText">

</div>

<button
onclick="readLesson()">

🔊 Read

</button>

<input
id="lessonInput"

placeholder="Type sentence">

<div
class="message"
id="lessonMessage">

</div>

<button
id="lessonNext"

style="display:none"

onclick="nextLesson()">

Keep Going ➡️

</button>

</div>

<div
class="section"
id="puzzleScreen"

style="display:none;">

<h2 id="puzzleCounter"></h2>

<div
class="sentence"
id="puzzleText">

</div>

<button
onclick="readPuzzle()">

🔊 Read

</button>

<div
id="wordBank"

class="word-bank">

</div>

<div
id="target"

class="target">

</div>

<button
onclick="checkPuzzle()">

Check ✅

</button>

<div
class="message"
id="puzzleMessage">

</div>

<button
id="puzzleNext"

style="display:none"

onclick="nextPuzzle()">

Keep Going ➡️

</button>

</div>

</div>

<script>

const data=[

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];

let lessonIndex=0;

let puzzleIndex=0;

let lastWord="";

function speak(text){

speechSynthesis.cancel();

speechSynthesis.speak(

new SpeechSynthesisUtterance(
text
)

);

}

/* OPEN */

function openLessons(){

document
.getElementById(
"home"
)
.style.display=
"none";

document
.getElementById(
"lessonScreen"
)
.style.display=
"block";

loadLesson();

}

function openPuzzles(){

document
.getElementById(
"home"
)
.style.display=
"none";

document
.getElementById(
"puzzleScreen"
)
.style.display=
"block";

loadPuzzle();

}

/* LESSON */

function loadLesson(){

document
.getElementById(
"lessonCounter"
)
.textContent=

`Lesson ${
lessonIndex+1
} of ${
data.length
}`;

document
.getElementById(
"lessonText"
)
.textContent=
data[
lessonIndex
];

document
.getElementById(
"lessonInput"
)
.value="";

document
.getElementById(
"lessonMessage"
)
.textContent="";

document
.getElementById(
"lessonNext"
)
.style.display=
"none";

lastWord="";

}

function readLesson(){

speak(
data[
lessonIndex
]
);

}

document
.getElementById(
"lessonInput"
)

.addEventListener(
"input",

function(){

let text=
this.value;

let words=
text
.trim()
.split(/\s+/);

let newest=
words[
words.length-1
];

if(

text.endsWith(" ")

&&

newest

&&

newest!==lastWord

){

lastWord=
newest;

speak(
newest
);

}

if(

text
.trim()
.toLowerCase()

===

data[
lessonIndex
]
.toLowerCase()

){

document
.getElementById(
"lessonMessage"
)
.textContent=
"🎉 Great lesson!";

document
.getElementById(
"lessonNext"
)
.style.display=
"block";

}

}

);

function nextLesson(){

lessonIndex++;

if(
lessonIndex<
data.length
){

loadLesson();

}

}

/* PUZZLE */

function loadPuzzle(){

document
.getElementById(
"puzzleCounter"
)
.textContent=

`Puzzle ${
puzzleIndex+1
} of ${
data.length
}`;

document
.getElementById(
"puzzleText"
)
.textContent=
data[
puzzleIndex
];

document
.getElementById(
"wordBank"
)
.innerHTML="";

document
.getElementById(
"target"
)
.innerHTML="";

document
.getElementById(
"puzzleMessage"
)
.textContent="";

document
.getElementById(
"puzzleNext"
)
.style.display=
"none";

let words=

[
...
data[
puzzleIndex
]
.split(" ")
];

words.sort(
()=>Math.random()-.5
);

words.forEach(word=>{

let tile=
document
.createElement(
"div"
);

tile.className=
"word";

tile.textContent=
word;

tile.onclick=
()=>{

if(
tile.parentNode.id===
"wordBank"
){

document
.getElementById(
"target"
)
.appendChild(
tile
);

}

else{

document
.getElementById(
"wordBank"
)
.appendChild(
tile
);

}

speak(
word
);

};

document
.getElementById(
"wordBank"
)
.appendChild(
tile
);

});

}

function readPuzzle(){

speak(
data[
puzzleIndex
]
);

}

function checkPuzzle(){

let answer=

[
...
document
.getElementById(
"target"
)
.children
]

.map(
x=>
x.textContent
)

.join(
" "
);

if(

answer
.toLowerCase()

===

data[
puzzleIndex
]
.toLowerCase()

){

document
.getElementById(
"puzzleMessage"
)
.textContent=
"🎉 Great puzzle!";

document
.getElementById(
"puzzleNext"
)
.style.display=
"block";

}

}

function nextPuzzle(){

puzzleIndex++;

if(
puzzleIndex<
data.length
){

loadPuzzle();

}

}

</script>

</body>
</html>
