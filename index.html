<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Learning System</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial;
background:#eaf6f3;
}

.section{

background:white;

padding:30px;

border-radius:25px;

max-width:900px;

margin:auto;

box-shadow:0 4px 12px #bbb;

}

.grid{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(
150px,
1fr
)
);

gap:20px;

}

.lesson{

height:140px;

background:#8fc8b7;

border-radius:22px;

display:flex;

align-items:center;

justify-content:center;

font-size:42px;

font-weight:bold;

cursor:pointer;

}

.sentence{

font-size:34px;

font-weight:bold;

margin:20px 0;

}

button{

width:100%;

padding:22px;

font-size:28px;

border:none;

border-radius:18px;

margin-top:15px;

background:#8fc8b7;

}

input{

width:100%;

padding:20px;

font-size:28px;

border-radius:18px;

box-sizing:border-box;

}

.success{

text-align:center;

font-size:45px;

}

</style>

</head>

<body>

<div
class="section"
id="lessonSelect">

<h1>

Choose Lesson

</h1>

<div
class="grid"
id="grid">

</div>

</div>

<div
class="section"

id="lessonScreen"

style="display:none;">

<h2 id="counter"></h2>

<div
class="sentence"
id="sentence">

</div>

<button
onclick="readSentence()">

🔊 Read

</button>

<input
id="typing">

</div>

<div
class="section"

id="good"

style="display:none;">

<div
class="success">

🎉 Good Job!

</div>

<button
onclick="nextLesson()">

Keep Going ➡️

</button>

</div>

<script>

const lessons=[

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];

let current=0;

let lastWord="";

/* SPEECH */

function speak(text){

speechSynthesis.cancel();

speechSynthesis.speak(

new SpeechSynthesisUtterance(
text
)

);

}

/* CREATE BOXES */

const grid=
document
.getElementById(
"grid"
);

lessons.forEach(
(
lesson,
i
)=>{

let box=
document
.createElement(
"div"
);

box.className=
"lesson";

box.textContent=
i+1;

box.onclick=
()=>{

current=i;

openLesson();

};

grid.appendChild(
box
);

}

);

/* OPEN */

function openLesson(){

document
.getElementById(
"lessonSelect"
)
.style.display=
"none";

document
.getElementById(
"good"
)
.style.display=
"none";

document
.getElementById(
"lessonScreen"
)
.style.display=
"block";

document
.getElementById(
"counter"
)
.textContent=

`Lesson ${
current+1
}`;

document
.getElementById(
"sentence"
)
.textContent=
lessons[
current
];

document
.getElementById(
"typing"
)
.value="";

lastWord="";

}

/* READ */

function readSentence(){

speak(
lessons[
current
]
);

}

document
.getElementById(
"typing"
)

.addEventListener(
"input",

function(){

let text=
this.value;

let words=
text
.trim()
.split(/\s+/);

let newest=
words[
words.length-1
];

if(

text.endsWith(" ")

&&

newest

&&

newest!==lastWord

){

lastWord=
newest;

speak(
newest
);

}

if(

text
.trim()
.toLowerCase()

===

lessons[
current
]
.toLowerCase()

){

document
.getElementById(
"lessonScreen"
)
.style.display=
"none";

document
.getElementById(
"good"
)
.style.display=
"block";

}

}

);

/* NEXT */

function nextLesson(){

current++;

if(
current<
lessons.length
){

openLesson();

}

else{

document
.getElementById(
"good"
)
.innerHTML=

`
<div
class="success">

🏆 Finished All Lessons

</div>
`;

}

}

</script>

</body>

</html>
