<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning System</title>

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef5ff;
}

.screen{
display:flex;
justify-content:center;
padding:24px;
min-height:100vh;
}

.card{
width:100%;
max-width:900px;
background:white;
padding:32px;
border-radius:30px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(150px,1fr));
gap:18px;
}

.box{
height:150px;
display:flex;
align-items:center;
justify-content:center;
font-size:36px;
font-weight:bold;
border-radius:25px;
cursor:pointer;
color:white;
background:
linear-gradient(
135deg,
#69a8ff,
#5fd8bf
);
}

.lock{
opacity:.35;
}

.sentence{
font-size:36px;
text-align:center;
margin:30px 0;
}

button{

width:100%;

padding:22px;

font-size:28px;

border:none;

border-radius:22px;

background:#69a8ff;

color:white;

margin-top:18px;

}

input{

width:100%;

padding:22px;

font-size:32px;

border-radius:20px;

}

.words{

display:flex;

flex-wrap:wrap;

gap:12px;

padding:18px;

min-height:120px;

border-radius:20px;

}

#bank{
background:#edf7ff;
}

#target{
background:#fff7d5;
margin-top:20px;
}

.word{

background:white;

padding:16px;

font-size:28px;

border-radius:18px;

cursor:pointer;

}

.good{

font-size:52px;

text-align:center;

}

</style>

</head>

<body>

<div
class="screen"
id="home">

<div class="card">

<h1>

Choose Activity

</h1>

<div class="grid">

<div
class="box"
onclick="choose('typing')">

✏️ Typing

</div>

<div
class="box"
onclick="choose('puzzle')">

🧩 Puzzle

</div>

</div>

</div>

</div>

<div
class="screen"
id="lessonScreen"

style="display:none">

<div class="card">

<h1 id="title"></h1>

<div
class="grid"
id="lessonGrid">

</div>

</div>

</div>

<div
class="screen"
id="activity"

style="display:none">

<div class="card">

<h2 id="counter"></h2>

<div
class="sentence"
id="sentence">

</div>

<button
onclick="readSentence()">

🔊 Read

</button>

<div id="typingArea">

<input
id="typingInput">

</div>

<div
id="puzzleArea"

style="display:none">

<div
class="words"
id="bank">

</div>

<div
class="words"
id="target">

</div>

<button
onclick="checkPuzzle()">

Check

</button>

</div>

</div>

</div>

<div
class="screen"
id="finish"

style="display:none">

<div class="card">

<div
class="good"
id="finishTitle">

🎉 Good Job!

</div>

<button
id="nextButton">

Keep Going ➡️

</button>

</div>

</div>

<script>

const lessons=[

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];

let mode="typing";

let current=0;

let typingUnlocked=1;

let puzzleUnlocked=1;

let lastWord="";

function speak(t){

speechSynthesis.speak(

new SpeechSynthesisUtterance(
t
)

);

}

function choose(m){

mode=m;

home.style.display=
"none";

lessonScreen.style.display=
"flex";

title.textContent=

mode==="typing"

?

"Choose Lesson"

:

"Choose Puzzle";

draw();

}

function draw(){

lessonGrid.innerHTML="";

let unlocked=

mode==="typing"

?

typingUnlocked

:

puzzleUnlocked;

lessons.forEach(
(
x,
i
)=>{

let d=
document
.createElement(
"div"
);

d.className=
"box";

if(
i<
unlocked
){

d.textContent=
i+1;

d.onclick=
()=>{

current=i;

openLesson();

};

}

else{

d.textContent=
"🔒";

d.classList.add(
"lock"
);

}

lessonGrid.appendChild(
d
);

});

}

function openLesson(){

lessonScreen.style.display=
"none";

activity.style.display=
"flex";

counter.textContent=

`${mode}

 ${
current+1
}`;

sentence.textContent=

lessons[
current
];

if(
mode==="typing"
){

typingArea.style.display=
"block";

puzzleArea.style.display=
"none";

typingInput.value="";

}

else{

typingArea.style.display=
"none";

puzzleArea.style.display=
"block";

loadPuzzle();

}

}

function readSentence(){

speak(
lessons[
current
]
);

}

/* TYPING */

typingInput
.addEventListener(
"input",

function(){

let t=
this.value;

let words=
t.trim()
.split(/\s+/);

let newest=
words[
words.length-1
];

if(

t.endsWith(" ")

&&

newest

&&

newest!==lastWord

){

lastWord=
newest;

speak(
newest
);

}

if(

t.trim()
.toLowerCase()

===

lessons[
current
]
.toLowerCase()

){

finishLesson();

}

}

);

/* PUZZLE */

function loadPuzzle(){

bank.innerHTML="";

target.innerHTML="";

let words=
[
...
lessons[
current
]
.split(" ")
];

words.sort(
()=>Math.random()-.5
);

words.forEach(
word=>{

let d=
document
.createElement(
"div"
);

d.className=
"word";

d.textContent=
word;

d.onclick=
()=>{

speak(
word
);

setTimeout(
()=>{

if(
d.parentNode===
bank
){

target.appendChild(
d
);

}

else{

bank.appendChild(
d
);

}

},
120
);

};

bank.appendChild(
d
);

});

}

function checkPuzzle(){

let answer=

[
...
target.children
]

.map(
x=>
x.textContent
)

.join(" ");

if(

answer
.toLowerCase()

===

lessons[
current
]
.toLowerCase()

){

finishLesson();

}

}

function finishLesson(){

activity.style.display=
"none";

finish.style.display=
"flex";

nextButton.textContent=
"Keep Going ➡️";

nextButton.onclick=
next;

}

function next(){

if(
mode==="typing"
){

typingUnlocked=
Math.max(
typingUnlocked,
current+2
);

}

else{

puzzleUnlocked=
Math.max(
puzzleUnlocked,
current+2
);

}

current++;

if(
current<
lessons.length
){

finish.style.display=
"none";

openLesson();

}

else{

finishTitle.textContent=
"🏆 Finished!";

nextButton.textContent=
"Go Back To Main Menu";

nextButton.onclick=
()=>{

current=0;

finish.style.display=
"none";

home.style.display=
"flex";

};

}

}

</script>

</body>
</html>
