<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Learning System
</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:
Arial,
sans-serif;

background:#eef5ff;

}

.screen{

display:flex;

justify-content:center;

padding:25px;

min-height:100vh;

}

.card{

width:100%;

max-width:900px;

background:white;

padding:35px;

border-radius:30px;

box-shadow:
0 10px 30px
rgba(0,0,0,.08);

}

h1,h2{

text-align:center;

}

.grid{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(
150px,
1fr
));

gap:18px;

}

.box{

height:150px;

display:flex;

justify-content:center;

align-items:center;

font-size:38px;

font-weight:bold;

border-radius:24px;

cursor:pointer;

background:
linear-gradient(
135deg,
#69a8ff,
#5fd8bf
);

color:white;

}

.box:active{

transform:
scale(.98);

}

.sentence{

font-size:36px;

text-align:center;

margin:30px 0;

line-height:1.5;

}

button{

width:100%;

padding:22px;

font-size:28px;

border:none;

border-radius:22px;

background:#69a8ff;

color:white;

margin-top:18px;

}

input{

width:100%;

padding:20px;

font-size:32px;

border-radius:22px;

border:
3px solid
#dbe7ff;

}

.words{

display:flex;

flex-wrap:wrap;

gap:12px;

padding:18px;

border-radius:20px;

min-height:120px;

}

#bank{

background:#edf7ff;

}

#target{

background:#fff7d5;

margin-top:20px;

}

.word{

padding:16px;

font-size:30px;

background:white;

border-radius:18px;

cursor:pointer;

}

.good{

font-size:54px;

text-align:center;

}

.small{

text-align:center;

font-size:28px;

color:#666;

}

.lock{

opacity:.35;

}

</style>

</head>

<body>

<!-- MODE -->

<div
class="screen"
id="mode">

<div class="card">

<h1>

Choose Activity

</h1>

<div class="grid">

<div
class="box"

onclick="choose('typing')">

✏️ Typing

</div>

<div
class="box"

onclick="choose('puzzle')">

🧩 Puzzle

</div>

</div>

</div>

</div>

<!-- LESSONS -->

<div
class="screen"

id="lessons"

style="display:none">

<div class="card">

<h1>

Choose Lesson

</h1>

<div
class="grid"
id="lessonGrid">

</div>

</div>

</div>

<!-- ACTIVITY -->

<div
class="screen"

id="activity"

style="display:none">

<div class="card">

<h2 id="counter"></h2>

<div
class="sentence"
id="sentence">

</div>

<button
onclick="readSentence()">

🔊 Read

</button>

<div
id="typingArea">

<input
id="typingInput"

placeholder="Type here">

</div>

<div
id="puzzleArea"

style="display:none">

<div
id="bank"

class="words">

</div>

<div
id="target"

class="words">

</div>

<button
onclick="checkPuzzle()">

Check ✅

</button>

</div>

</div>

</div>

<!-- GOOD -->

<div
class="screen"

id="good"

style="display:none">

<div class="card">

<div
class="good"
id="goodTitle">

🎉 Good Job!

</div>

<div class="small">

Ready for the next one?

</div>

<button
id="nextBtn"

onclick="nextLesson()">

Keep Going ➡️

</button>

</div>

</div>

<script>

const lessons=[

"I like to eat watermelon every day",

"My name is Adi",

"I love pasta to eat when appa makes it",

"My brothers name is Sid",

"I go to CABI school"

];

let mode="typing";

let current=0;

let unlocked=1;

let lastWord="";

/* SPEAK */

function speak(text){

let u=
new SpeechSynthesisUtterance(
text
);

u.rate=.85;

speechSynthesis.speak(
u
);

}

/* MODE */

function choose(m){

mode=m;

mode.style?.display;

document
.getElementById(
"mode"
)
.style.display=
"none";

document
.getElementById(
"lessons"
)
.style.display=
"flex";

drawLessons();

}

/* LESSONS */

function drawLessons(){

let grid=
document
.getElementById(
"lessonGrid"
);

grid.innerHTML="";

lessons.forEach(
(
x,
i
)=>{

let d=
document
.createElement(
"div"
);

d.className=
"box";

if(
i<
unlocked
){

d.textContent=
i+1;

d.onclick=
()=>{

current=i;

openLesson();

};

}

else{

d.textContent=
"🔒";

d.classList.add(
"lock"
);

}

grid.appendChild(
d
);

});

}

/* OPEN */

function openLesson(){

document
.getElementById(
"lessons"
)
.style.display=
"none";

document
.getElementById(
"good"
)
.style.display=
"none";

document
.getElementById(
"activity"
)
.style.display=
"flex";

counter.textContent=

`${mode==="typing"
?
"Lesson"
:
"Puzzle"}

 ${
current+1
}`;

sentence.textContent=
lessons[
current
];

if(
mode==="typing"
){

typing();

}

else{

puzzle();

}

}

function readSentence(){

speak(
lessons[
current
]
);

}

/* TYPING */

function typing(){

typingArea.style.display=
"block";

puzzleArea.style.display=
"none";

typingInput.value="";

typingInput.focus();

lastWord="";

}

typingInput
.addEventListener(
"input",

function(){

let t=
this.value;

let words=
t.trim()
.split(/\s+/);

let newest=
words[
words.length-1
];

if(

t.endsWith(" ")

&&

newest

&&

newest!==lastWord

){

lastWord=
newest;

speak(
newest
);

}

if(

t.trim()
.toLowerCase()

===

lessons[
current
]
.toLowerCase()

){

finish();

}

}

/* PUZZLE */

);

function puzzle(){

typingArea.style.display=
"none";

puzzleArea.style.display=
"block";

bank.innerHTML="";

target.innerHTML="";

let words=
[
...
lessons[
current
]
.split(" ")
];

words.sort(
()=>Math.random()-.5
);

words.forEach(
word=>{

let tile=
document
.createElement(
"div"
);

tile.className=
"word";

tile.textContent=
word;

tile.onclick=
()=>{

speak(
word
);

setTimeout(
()=>{

if(
tile.parentNode===
bank
){

target.appendChild(
tile
);

}

else{

bank.appendChild(
tile
);

}

},
120
);

};

bank.appendChild(
tile
);

});

}

function checkPuzzle(){

let answer=

[
...
target.children
]

.map(
x=>
x.textContent
)

.join(
" "
);

if(

answer
.toLowerCase()

===

lessons[
current
]
.toLowerCase()

){

finish();

}

}

/* FINISH */

function finish(){

activity.style.display=
"none";

good.style.display=
"flex";

}

function nextLesson(){

current++;

unlocked=
Math.max(
unlocked,
current+1
);

if(
current<
lessons.length
){

openLesson();

}

else{

goodTitle.textContent=
"🏆 Finished!";

nextBtn.textContent=
"Go Back To Main Menu";

nextBtn.onclick=
backHome;

}

}

function backHome(){

current=0;

document
.getElementById(
"good"
)
.style.display=
"none";

document
.getElementById(
"mode"
)
.style.display=
"flex";

}

</script>

</body>

</html>
